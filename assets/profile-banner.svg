<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 224" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Bin Zohaib — AI Automation Engineer</title>
  <desc id="desc">A charcoal and lime editorial banner with bold typography and an animated event-to-action workflow signal.</desc>
  <defs>
    <pattern id="grid" width="80" height="56" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V56" fill="none" stroke="#1e241f" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="224" rx="4" fill="#0f1211"/>
  <rect width="960" height="224" fill="url(#grid)"/>

  <text x="52" y="34" fill="#c6ff5b" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1.4">MBZ  /  SYSTEMS NOTES</text>
  <path d="M52 55H535" stroke="#364137" stroke-width="1"/>
  <path d="M52 55H190" stroke="#c6ff5b" stroke-width="1.5" opacity=".75">
    <animate attributeName="opacity" values=".35;.9;.35" dur="3.8s" repeatCount="indefinite"/>
  </path>

  <text x="52" y="108" fill="#eff1e8" font-family="Inter,Arial,Helvetica,sans-serif" font-size="37" font-weight="750" letter-spacing=".4">MUHAMMAD BIN</text>
  <text x="52" y="151" fill="#eff1e8" font-family="Inter,Arial,Helvetica,sans-serif" font-size="37" font-weight="750" letter-spacing=".4">ZOHAIB</text>
  <text x="55" y="187" fill="#a5afa4" font-family="monospace" font-size="11.5" letter-spacing=".55">AI AUTOMATION  ·  AGENTS  ·  INTEGRATIONS</text>

  <path d="M590 25V198" stroke="#364137" stroke-width="1"/>
  <text x="635" y="38" fill="#859186" font-family="monospace" font-size="10" font-weight="700" letter-spacing=".8">EVENT  →  DECISION  →  ACTION</text>

  <g fill="none" stroke="#435043" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M660 64H790"/>
    <path d="M660 165H790"/>
    <path d="M790 64H837V114H885"/>
    <path d="M790 165H837V114"/>
    <path d="M660 64V165"/>
  </g>

  <g fill="#0f1211" stroke="#eff1e8" stroke-width="2">
    <circle cx="660" cy="64" r="5"/>
    <circle cx="790" cy="64" r="5"/>
    <circle cx="660" cy="165" r="5"/>
    <circle cx="790" cy="165" r="5"/>
    <circle cx="885" cy="114" r="6"/>
  </g>

  <circle r="3.8" fill="#c6ff5b" filter="url(#glow)">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M660 64H790H837V114H885"/>
    <animate attributeName="opacity" values=".25;1;1;.25" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" fill="#c6ff5b" filter="url(#glow)">
    <animateMotion dur="3.6s" begin="-1.8s" repeatCount="indefinite" path="M660 165H790H837V114"/>
    <animate attributeName="opacity" values=".2;1;1;.2" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="885" cy="50" r="4" fill="#c6ff5b">
    <animate attributeName="r" values="3.5;5;3.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="898" y="54" fill="#859186" font-family="monospace" font-size="9">FLOW</text>
  <text x="635" y="191" fill="#859186" font-family="monospace" font-size="9" font-weight="700" letter-spacing=".25">BUILT WITH INTENT. SHIPPED WITH CARE.</text>
</svg>