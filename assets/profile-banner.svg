<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 224" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Bin Zohaib — AI automation, agents and integrations</title>
  <desc id="desc">An editorial dark banner with a subtle animated workflow diagram.</desc>
  <defs>
    <pattern id="grid" width="80" height="56" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V56" fill="none" stroke="#1e241f" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="224" fill="#0f1211"/>
  <rect width="960" height="224" fill="url(#grid)"/>
  <text x="52" y="42" fill="#c6ff5b" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1.4">MBZ  /  SYSTEMS NOTES</text>
  <path d="M52 55H535" stroke="#364137" stroke-width="1"/>
  <text x="52" y="108" fill="#eff1e8" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="1.1">MUHAMMAD BIN</text>
  <text x="52" y="151" fill="#eff1e8" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="1.1">ZOHAIB</text>
  <text x="55" y="187" fill="#859186" font-family="monospace" font-size="12" letter-spacing="0.5">AI AUTOMATION  ·  AGENTS  ·  INTEGRATIONS</text>
  <path d="M590 25V198" stroke="#364137" stroke-width="1"/>
  <text x="635" y="38" fill="#859186" font-family="monospace" font-size="10" font-weight="700" letter-spacing="0.8">EVENT  →  DECISION  →  ACTION</text>
  <g fill="none" stroke="#435043" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M660 64H790"/>
    <path d="M660 165H790"/>
    <path d="M790 64H837V114H885"/>
    <path d="M790 165H837V114"/>
    <path d="M660 64V165"/>
  </g>
  <g fill="#0f1211" stroke="#eff1e8" stroke-width="2">
    <circle cx="660" cy="64" r="6"/>
    <circle cx="790" cy="64" r="6"/>
    <circle cx="660" cy="165" r="6"/>
    <circle cx="790" cy="165" r="6"/>
    <circle cx="885" cy="114" r="7"/>
  </g>
  <circle r="4" fill="#c6ff5b" filter="url(#soft-glow)">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M660 64H790H837V114H885"/>
  </circle>
  <circle r="3" fill="#c6ff5b" filter="url(#soft-glow)">
    <animateMotion dur="3.4s" begin="-1.7s" repeatCount="indefinite" path="M660 165H790H837V114"/>
  </circle>
  <circle cx="885" cy="50" r="4" fill="#c6ff5b"/>
  <text x="898" y="54" fill="#859186" font-family="monospace" font-size="10">FLOW</text>
  <text x="635" y="191" fill="#859186" font-family="monospace" font-size="10" font-weight="700" letter-spacing="0.25">BUILT WITH INTENT. SHIPPED WITH CARE.</text>
</svg>